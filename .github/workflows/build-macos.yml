name: Build Miru macOS

on:
  workflow_dispatch: # لتشغيل البناء يدوياً في أي وقت بضغطة زر

jobs:
  build-macos:
    runs-on: macos-14 # استخدام معالجات أبل سيليكون الحديثة للبناء السريع والتوافق الأعلى
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # مهم جداً لأن مشروع Miru يعتمد على موديلات فرعية

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # إصدار مستقر ومتوافق

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable macOS support
        run: flutter config --enable-macos-desktop

      - name: Build macOS App (Release without signing)
        run: |
          # تمرير أمر البناء وتعطيل التوقيع البرمجي عبر معايير Xcode المباشرة
          flutter build macos --release --config-only
          cd macos
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Compress App Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r Miru-macOS.zip Miru.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miru-macOS-Build
          path: build/macos/Build/Products/Release/Miru-macOS.zip
